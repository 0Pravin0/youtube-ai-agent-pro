[package]
name = "youtube-ai-agent-pro"
version = "1.0.0"
description = "YouTube AI Agent Pro - autonomous YouTube channel manager for Apple Silicon Macs"
authors = ["YouTube AI Agent Pro"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "youtube_ai_agent_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
